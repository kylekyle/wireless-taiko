[workspace]
members = [".", "xtask"]
resolver = "2"

[package]
name    = "wireless-taiko"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wireless-taiko"
path = "src/main.rs"

[dependencies]
bluer  = { version = "0.17", features = ["bluetoothd", "l2cap", "rfcomm"] }
tokio  = { version = "1", features = ["rt", "macros", "time", "signal", "sync"] }
anyhow = "1"
hidapi = { version = "2", features = ["linux-native"], default-features = false }
